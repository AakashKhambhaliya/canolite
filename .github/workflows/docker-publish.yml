name: Publish Docker image

# Builds the Canolite image for both linux/amd64 and linux/arm64 and pushes it
# to GitHub Container Registry (GHCR), so deployments can pull a prebuilt image
# (with Chromium baked in) instead of building it every time.
#
# ARM64 matters: Oracle Ampere, AWS Graviton and Raspberry Pi are all arm64, and
# an amd64-only image fails there with "no matching manifest for linux/arm64/v8".
# Each architecture builds on a native runner rather than under QEMU emulation —
# emulated Node builds take the better part of an hour, native ones take minutes.
#
# After the first successful run, make the package public once:
#   GitHub → your profile/org → Packages → canolite → Package settings →
#   Change visibility → Public
# (so `docker pull` works without authentication).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # One job per architecture, each pushing an untagged image by digest. The
  # merge job below stitches the digests into a single multi-arch tag.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare names
        run: |
          # GHCR rejects uppercase; the repository owner is mixed case.
          echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            SOURCE_COMMIT=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Scope the cache per platform so the two jobs don't evict each other.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-architecture digests into one manifest list, so a single
  # tag (`:latest`, `:v1.2.3`) serves the right image to whatever pulls it.
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare names
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"

  # Publish the GitHub Release for a v* tag.
  #
  # This exists because /api/update reads the GitHub *releases* API
  # (/releases/latest), and a pushed tag is invisible to it — only a published
  # Release makes existing installs see an update. Doing this by hand was easy
  # to forget, which left several tagged versions that no instance was ever
  # offered. Runs after the image is published, so the update the release
  # announces is always actually pullable.
  release:
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so release notes can diff against the previous tag

      # Prefer the hand-written section from CHANGELOG.md — a bare commit list
      # doesn't tell an operator that this upgrade needs a volume mounted first.
      # Falls back to generated notes when the tag has no changelog entry.
      - name: Extract release notes
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$tag" '
              $0 ~ "^## " tag "([[:space:]]|$)" { inside=1; next }
              inside && /^## / { exit }
              inside { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [ -s release-notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using CHANGELOG.md section for $tag."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG.md section for $tag — falling back to generated notes."
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_NOTES: ${{ steps.notes.outputs.found }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — refreshing notes and marking it latest."
            if [ "$HAS_NOTES" = "true" ]; then
              gh release edit "$tag" --notes-file release-notes.md \
                --draft=false --prerelease=false --latest
            else
              gh release edit "$tag" --draft=false --prerelease=false --latest
            fi
          else
            echo "Creating release $tag."
            if [ "$HAS_NOTES" = "true" ]; then
              gh release create "$tag" --title "Canolite $tag" --notes-file release-notes.md --latest
            else
              gh release create "$tag" --title "Canolite $tag" --generate-notes --latest
            fi
          fi
