name: Publish Docker image

# Builds the Canolite image and pushes it to GitHub Container Registry (GHCR)
# so deployments can pull a prebuilt image (with Chromium baked in) instead of
# building it every time.
#
# After the first successful run, make the package public once:
#   GitHub → your profile/org → Packages → canolite → Package settings →
#   Change visibility → Public
# (so `docker pull` works without authentication).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            SOURCE_COMMIT=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publish the GitHub Release for a v* tag.
  #
  # This exists because /api/update reads the GitHub *releases* API
  # (/releases/latest), and a pushed tag is invisible to it — only a published
  # Release makes existing installs see an update. Doing this by hand was easy
  # to forget, which left several tagged versions that no instance was ever
  # offered. Runs after the image is published, so the update the release
  # announces is always actually pullable.
  release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so release notes can diff against the previous tag

      # Prefer the hand-written section from CHANGELOG.md — a bare commit list
      # doesn't tell an operator that this upgrade needs a volume mounted first.
      # Falls back to generated notes when the tag has no changelog entry.
      - name: Extract release notes
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$tag" '
              $0 ~ "^## " tag "([[:space:]]|$)" { inside=1; next }
              inside && /^## / { exit }
              inside { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [ -s release-notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using CHANGELOG.md section for $tag."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG.md section for $tag — falling back to generated notes."
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_NOTES: ${{ steps.notes.outputs.found }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$HAS_NOTES" = "true" ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — refreshing notes and marking it latest."
            if [ "$HAS_NOTES" = "true" ]; then
              gh release edit "$tag" --notes-file release-notes.md \
                --draft=false --prerelease=false --latest
            else
              gh release edit "$tag" --draft=false --prerelease=false --latest
            fi
          else
            echo "Creating release $tag."
            gh release create "$tag" --title "Canolite $tag" "${notes[@]}" --latest
          fi
