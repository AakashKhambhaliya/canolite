# ============================================================
# Canolite — self-contained single-container deployment.
#
# Embedded PostgreSQL + local filesystem storage. All state (database,
# rendered images, uploads, backups) lives under /app/data — persist that ONE
# volume and you persist everything. Ideal for a VPS, Coolify, or Dokploy.
#
#   docker compose up -d --build
#
# To UPGRADE to a newer release, pull first — `up -d` on its own reuses the
# cached `latest` and silently keeps running the old version:
#
#   docker compose pull && docker compose up -d
#
# Then open the app and create your admin account (setup wizard), or set
# ADMIN_EMAIL / ADMIN_PASSWORD below to skip it.
# ============================================================
services:
  canolite:
    # Pulls the prebuilt image if available; `build: .` is the fallback (used
    # when you pass --build, or on architectures the image isn't published for).
    image: ghcr.io/aakashkhambhaliya/canolite:latest
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # IMPORTANT: set this to the public URL of your instance so generated
      # image URLs resolve correctly.
      - APP_URL=${APP_URL:-http://localhost:3000}
      # Optional: auto-provision the admin instead of the setup wizard.
      # Leave empty to use the setup wizard.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - canolite_data:/app/data # database + storage + backups (all state)
    restart: unless-stopped

volumes:
  canolite_data:
